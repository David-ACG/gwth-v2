[project]
name = "newsbot"
version = "0.1.0"
description = "Automated AI news scraper for GWTH.ai and newsbot.biz"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.0",
    "anthropic>=0.52",
    "supabase>=2.0",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[project.scripts]
newsbot = "src.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

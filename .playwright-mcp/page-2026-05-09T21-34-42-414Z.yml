                - article [ref=e161]:
                  - paragraph [ref=e162]: "Yesterday you wrote one paragraph on a sticky note: the smallest useful tool you wished existed at work last week. Today you turn that paragraph into something you can actually run."
                  - paragraph [ref=e163]:
                    - text: Most people, when they first sit down to build with a model, get stuck deciding what to build. They reach for the demo problems, the toy chatbot, the joke summariser. The teaching here is the opposite. Your first useful tool should be small, embarrassing, and
                    - emphasis [ref=e164]: specific to your own week
                    - text: . Not a portfolio piece. A pocket knife.
                  - blockquote [ref=e165]: The brief should fit on a sticky note. If it doesn’t, the tool will not ship.
                  - paragraph [ref=e166]: Look at what you actually did between Monday and Friday. The repeated work, not the interesting work. Stand-up notes that became Jira tickets. Inbound emails that became three-line replies. The fortnightly slide where you copy six rows out of a spreadsheet. The point is not that any of these things are hard, it is that they are boring, and the model does not get bored.
                  - figure "Input from somewhere you already are, one model call, output back to where you already are. No new app to open." [ref=e167]:
                    - generic [ref=e169]: FIG. 03 · A USEFUL TOOL, ANATOMY
                    - generic [ref=e170]: Input from somewhere you already are, one model call, output back to where you already are. No new app to open.
                  - paragraph [ref=e171]: "Three rules for picking the brief. First: the input has to come from a place you already go, an email, a doc, a spreadsheet. Second: the output has to land in a place you already look, a Slack message, a Notion page, a Calendar event. Third: there is no new tab. If your tool needs a new tab, it is a product, not a tool, and you will not use it on Wednesday afternoon when you are tired."
                  - complementary [ref=e172]:
                    - generic [ref=e173]: WORKED EXAMPLE
                    - generic [ref=e174]: Last cohort, the most-shipped lesson-13 build was a five-line script that read the latest message in a Gmail label called triage, asked Claude for a one-sentence summary, and wrote it back as a draft reply. Forty minutes. Saved its author about an hour a week.
                  - paragraph [ref=e175]: By the end of the next page you will have written your one-paragraph brief. By the end of the lesson you will have run the tool against a real input from your own week, and decided whether to keep it or throw it away. Both outcomes count.

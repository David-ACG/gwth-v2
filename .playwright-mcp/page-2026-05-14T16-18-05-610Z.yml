          - generic [ref=e576]:
            - generic [ref=e577]: Module 04 · Lesson 12
            - heading "How models think about uncertainty." [level=3] [ref=e578]
            - paragraph [ref=e579]: Most people assume a language model has a single opinion. It doesn't. At each step it holds a probability distribution over thousands of possible next moves, and what you see in the answer is one path sampled from that distribution.
            - paragraph [ref=e580]:
              - text: The practical implication is that
              - mark [ref=e581]: asking the same question twice rarely gives you the same answer twice

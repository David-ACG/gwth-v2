<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GWTH Scorecard Variants</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: oklch(0.94 0.006 70);
        color: oklch(0.18 0.04 175);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0 0 24px; font-size: 34px; }
      .grid { display: grid; gap: 28px; }
      figure { margin: 0; }
      img {
        display: block;
        width: min(100%, 1200px);
        height: auto;
        border-radius: 8px;
        box-shadow: 0 18px 54px oklch(0.2 0.02 80 / 0.18);
      }
      figcaption { margin-top: 10px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>GWTH Scorecard Variants</h1>
    <main class="grid">
      <figure>
            <img src="./gwth-scorecard-01-market-board.png" alt="Market board scorecard variant" />
            <figcaption>Market board: gwth-scorecard-01-market-board.png</figcaption>
          </figure>
<figure>
            <img src="./gwth-scorecard-02-terminal-ticket.png" alt="Terminal ticket scorecard variant" />
            <figcaption>Terminal ticket: gwth-scorecard-02-terminal-ticket.png</figcaption>
          </figure>
<figure>
            <img src="./gwth-scorecard-03-currentness-alert.png" alt="Currentness alert scorecard variant" />
            <figcaption>Currentness alert: gwth-scorecard-03-currentness-alert.png</figcaption>
          </figure>
<figure>
            <img src="./gwth-scorecard-04-employer-quote.png" alt="Employer quote scorecard variant" />
            <figcaption>Employer quote: gwth-scorecard-04-employer-quote.png</figcaption>
          </figure>
<figure>
            <img src="./gwth-scorecard-05-pixel-wall.png" alt="Pixel wall scorecard variant" />
            <figcaption>Pixel wall: gwth-scorecard-05-pixel-wall.png</figcaption>
          </figure>
    </main>
  </body>
</html>

<text x="186.2" y="512" font-size="12" text-anchor="middle" fill="#555">(quartile 1)</text>
<rect x="322.9" y="110.0" width="111.6" height="104.5" fill="#1b7f9e"/>
<rect x="322.9" y="214.5" width="111.6" height="255.5" fill="#7b3294"/>
<text x="378.8" y="168.3" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">29.0%</text>
<text x="378.8" y="348.3" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">71.0%</text>

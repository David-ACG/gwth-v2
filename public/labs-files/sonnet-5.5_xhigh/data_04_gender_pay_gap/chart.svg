<text x="80" y="259.0" font-size="13" text-anchor="end" fill="#444">60%</text>
<line x1="90" y1="182.0" x2="860" y2="182.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="80" y="187.0" font-size="13" text-anchor="end" fill="#444">80%</text>

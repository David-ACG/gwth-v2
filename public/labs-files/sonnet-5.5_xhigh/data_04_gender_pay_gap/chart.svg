<text x="90" y="38" font-size="22" font-weight="bold" fill="#222">Women and men in each pay quartile</text>
<text x="90" y="62" font-size="14" fill="#444">Full-pay relevant employees at 5 April 2026 (248 people, 62 in each quartile). Quartile 1 is the lowest paid.</text>
<rect x="90" y="78" width="14" height="14" fill="#7b3294"/>
<text x="110" y="90" font-size="14" fill="#222">Women</text>

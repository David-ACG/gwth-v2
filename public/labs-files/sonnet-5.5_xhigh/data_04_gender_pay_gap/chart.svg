<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Women and men in each pay quartile, 5 April 2026</title>
<desc id="d">Percentage of women and men in each of four pay quartiles. Lower quartile: women 77.4%, men 22.6%; Lower middle: women 71.0%, men 29.0%; Upper middle: women 74.2%, men 25.8%; Upper quartile: women 53.2%, men 46.8%.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title & Subtitle -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Thistlecombe Care - Pay Quartile Gender Breakdown</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#64748b">Proportion of Women and Men in Each Pay Quartile (5 April 2026 Snapshot)</text>

  <!-- Legend -->
  <g transform="translate(280, 95)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#2563eb" />
    <text x="26" y="14" font-size="14" font-weight="500" fill="#334155">Women</text>
    <rect x="130" y="0" width="18" height="18" rx="4" fill="#075985" />
    <text x="156" y="14" font-size="14" font-weight="500" fill="#334155">Men</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-dasharray="4,4" stroke-width="1">
    <line x1="180" y1="150" x2="720" y2="150" />
    <line x1="180" y1="210" x2="720" y2="210" />
    <line x1="180" y1="270" x2="720" y2="270" />
    <line x1="180" y1="330" x2="720" y2="330" />
    <line x1="180" y1="390" x2="720" y2="390" />
  </g>

  <!-- X-Axis percentages -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="180" y="415">0%</text>
    <text x="315" y="415">25%</text>
    <text x="450" y="415">50%</text>
    <text x="585" y="415">75%</text>
    <text x="720" y="415">100%</text>
  </g>

  <!-- Bars & Quartile Labels -->
  <!-- Q1 Lower -->
  <g transform="translate(0, 130)">
    <text x="165" y="26" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">Lower (Q1)</text>
    <!-- Women bar 79.0% -> width = 79.0 * 5.4 = 426.6 -->
    <rect x="180" y="8" width="426.6" height="32" rx="4" fill="#2563eb" />
    <text x="393.3" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">79.0%</text>
    <!-- Men bar 21.0% -> x = 180 + 426.6 = 606.6, width = 113.4 -->
    <rect x="606.6" y="8" width="113.4" height="32" rx="4" fill="#075985" />
    <text x="663.3" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">21.0%</text>
  </g>

  <!-- Q2 Lower Middle -->
  <g transform="translate(0, 190)">
    <text x="165" y="26" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">Lower Middle (Q2)</text>
    <!-- Women bar 66.1% -> width = 356.94 -->
    <rect x="180" y="8" width="356.94" height="32" rx="4" fill="#2563eb" />
    <text x="358.47" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">66.1%</text>
    <!-- Men bar 33.9% -> x = 536.94, width = 183.06 -->
    <rect x="536.94" y="8" width="183.06" height="32" rx="4" fill="#075985" />
    <text x="628.47" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">33.9%</text>
  </g>

  <!-- Q3 Upper Middle -->
  <g transform="translate(0, 250)">
    <text x="165" y="26" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">Upper Middle (Q3)</text>
    <!-- Women bar 72.6% -> width = 392.04 -->
    <rect x="180" y="8" width="392.04" height="32" rx="4" fill="#2563eb" />
    <text x="376.02" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">72.6%</text>
    <!-- Men bar 27.4% -> x = 572.04, width = 147.96 -->
    <rect x="572.04" y="8" width="147.96" height="32" rx="4" fill="#075985" />
    <text x="646.02" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">27.4%</text>
  </g>

  <!-- Q4 Upper -->
  <g transform="translate(0, 310)">
    <text x="165" y="26" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">Upper (Q4)</text>
    <!-- Women bar 58.1% -> width = 313.74 -->
    <rect x="180" y="8" width="313.74" height="32" rx="4" fill="#2563eb" />
    <text x="336.87" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">58.1%</text>
    <!-- Men bar 41.9% -> x = 493.74, width = 226.26 -->
    <rect x="493.74" y="8" width="226.26" height="32" rx="4" fill="#075985" />
    <text x="606.87" y="29" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">41.9%</text>
  </g>

  <!-- Note footer -->
  <text x="400" y="460" text-anchor="middle" font-size="12" fill="#94a3b8">Note: Quartiles based on 248 full-pay relevant employees (62 per quartile) as of 5 April 2026.</text>
</svg>
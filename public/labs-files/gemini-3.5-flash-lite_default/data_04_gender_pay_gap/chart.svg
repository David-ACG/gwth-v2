<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .title { font: bold 18px sans-serif; fill: #1f2937; }
    .subtitle { font: 12px sans-serif; fill: #4b5563; }
    .axis { font: 12px sans-serif; fill: #374151; }
    .bar-women { fill: #db2777; }
    .bar-men { fill: #2563eb; }
    .legend { font: 12px sans-serif; fill: #1f2937; }
    .val { font: bold 11px sans-serif; fill: #1f2937; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" fill="#f9fafb"/>
  <text x="40" y="35" class="title">Gender Breakdown by Pay Quartile</text>
  <text x="40" y="55" class="subtitle">Thistlecombe Care Ltd (Snapshot: 5 April 2026)</text>

  <!-- Legend -->
  <rect x="420" y="25" width="14" height="14" fill="#db2777" rx="2"/>
  <text x="440" y="37" class="legend">Women</text>
  <rect x="500" y="25" width="14" height="14" fill="#2563eb" rx="2"/>
  <text x="520" y="37" class="legend">Men</text>

  <!-- Chart area -->
  <!-- Quartiles: Lower (Q1), Lower Middle (Q2), Upper Middle (Q3), Upper (Q4) -->

  <text x="40" y="117" class="axis">Lower (Q1)</text>
  
  <!-- Bar background -->
  <rect x="160" y="90" width="380" height="45" fill="#e5e7eb" rx="4"/>
  
  <!-- Women bar -->
  <rect x="160" y="90" width="300.2" height="45" fill="#db2777" rx="4"/>
  
  <!-- Values text -->
  <text x="15170.0" y="117" class="val" fill="#ffffff">79.0% Women</text>
  <text x="34170.0" y="117" class="val" fill="#ffffff" style="font-size:10px;">21.0% Men</text>
    
  <text x="40" y="187" class="axis">Lower Middle (Q2)</text>
  
  <!-- Bar background -->
  <rect x="160" y="160" width="380" height="45" fill="#e5e7eb" rx="4"/>
  
  <!-- Women bar -->
  <rect x="160" y="160" width="251.17999999999995" height="45" fill="#db2777" rx="4"/>
  
  <!-- Values text -->
  <text x="12718.999999999998" y="187" class="val" fill="#ffffff">66.1% Women</text>
  <text x="31718.999999999996" y="187" class="val" fill="#ffffff" style="font-size:10px;">33.9% Men</text>
    
  <text x="40" y="257" class="axis">Upper Middle (Q3)</text>
  
  <!-- Bar background -->
  <rect x="160" y="230" width="380" height="45" fill="#e5e7eb" rx="4"/>
  
  <!-- Women bar -->
  <rect x="160" y="230" width="275.87999999999994" height="45" fill="#db2777" rx="4"/>
  
  <!-- Values text -->
  <text x="13953.999999999998" y="257" class="val" fill="#ffffff">72.6% Women</text>
  <text x="32954.0" y="257" class="val" fill="#ffffff" style="font-size:10px;">27.4% Men</text>
    
  <text x="40" y="327" class="axis">Upper (Q4)</text>
  
  <!-- Bar background -->
  <rect x="160" y="300" width="380" height="45" fill="#e5e7eb" rx="4"/>
  
  <!-- Women bar -->
  <rect x="160" y="300" width="220.78" height="45" fill="#db2777" rx="4"/>
  
  <!-- Values text -->
  <text x="11199.0" y="327" class="val" fill="#ffffff">58.1% Women</text>
  <text x="30199.0" y="327" class="val" fill="#ffffff" style="font-size:10px;">41.9% Men</text>
    
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Thistlecombe Care pay quartiles by sex</title>
<desc id="chart-desc">Percentage of women and men in each equal-sized pay quartile of full-pay relevant employees at the 5 April 2026 snapshot.</desc>
<rect width="1000" height="640" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17252a}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#52656d}.axis{font-size:13px;fill:#52656d}.rowlabel{font-size:17px;font-weight:700}.segment{font-size:16px;font-weight:700;fill:#ffffff}.legend{font-size:15px}.note{font-size:14px;fill:#52656d}</style>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Women and men in each hourly pay quartile, 5 April 2026</title>
<desc id="desc">Stacked bar chart. Women: Lower 77.4%, Lower middle 71.0%, Upper middle 74.2%, Upper 53.2%. Men: Lower 22.6%, Lower middle 29.0%, Upper middle 25.8%, Upper 46.8%. Women are 69.0% of all full-pay relevant employees.</desc>
<rect width="820" height="520" fill="#ffffff"/>
<text x="30" y="38" font-size="21" font-weight="bold" fill="#1a1a1a">Women and men in each hourly pay quartile</text>
<text x="30" y="62" font-size="14" fill="#444444">Thistlecombe Care Ltd, gender pay gap snapshot date 5 April 2026</text>
<rect x="30" y="80" width="14" height="14" fill="#A6500A"/>
<text x="50" y="92" font-size="14" fill="#1a1a1a">Women</text>
<rect x="120" y="80" width="14" height="14" fill="#1F4E79"/>
<text x="140" y="92" font-size="14" fill="#1a1a1a">Men</text>
<line x1="200" y1="87" x2="232" y2="87" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="240" y="92" font-size="14" fill="#1a1a1a">Women as a share of all employees in the quartiles</text>
<line x1="80" y1="420.0" x2="680" y2="420.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="70" y="425.0" font-size="13" fill="#444444" text-anchor="end">0%</text>
<line x1="80" y1="345.0" x2="680" y2="345.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="70" y="350.0" font-size="13" fill="#444444" text-anchor="end">25%</text>
<line x1="80" y1="270.0" x2="680" y2="270.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="70" y="275.0" font-size="13" fill="#444444" text-anchor="end">50%</text>
<line x1="80" y1="195.0" x2="680" y2="195.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="70" y="200.0" font-size="13" fill="#444444" text-anchor="end">75%</text>
<line x1="80" y1="120.0" x2="680" y2="120.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="70" y="125.0" font-size="13" fill="#444444" text-anchor="end">100%</text>
<rect x="105.0" y="120" width="100" height="67.7" fill="#1F4E79"/>
<rect x="105.0" y="187.7" width="100" height="232.3" fill="#A6500A"/>
<text x="155.0" y="159.9" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">22.6%</text>
<text x="155.0" y="337.7" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">77.4%</text>
<text x="155.0" y="444" font-size="14" fill="#1a1a1a" text-anchor="middle">Lower</text>
<text x="155.0" y="462" font-size="12" fill="#666666" text-anchor="middle">(lowest paid)</text>
<rect x="255.0" y="120" width="100" height="87.1" fill="#1F4E79"/>
<rect x="255.0" y="207.1" width="100" height="212.9" fill="#A6500A"/>
<text x="305.0" y="169.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">29.0%</text>
<text x="305.0" y="345.1" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">71.0%</text>
<text x="305.0" y="444" font-size="14" fill="#1a1a1a" text-anchor="middle">Lower middle</text>
<rect x="405.0" y="120" width="100" height="77.4" fill="#1F4E79"/>
<rect x="405.0" y="197.4" width="100" height="222.6" fill="#A6500A"/>
<text x="455.0" y="164.7" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">25.8%</text>
<text x="455.0" y="341.4" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">74.2%</text>
<text x="455.0" y="444" font-size="14" fill="#1a1a1a" text-anchor="middle">Upper middle</text>
<rect x="555.0" y="120" width="100" height="140.3" fill="#1F4E79"/>
<rect x="555.0" y="260.3" width="100" height="159.7" fill="#A6500A"/>
<text x="605.0" y="196.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">46.8%</text>
<text x="605.0" y="365.3" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">53.2%</text>
<text x="605.0" y="444" font-size="14" fill="#1a1a1a" text-anchor="middle">Upper</text>
<text x="605.0" y="462" font-size="12" fill="#666666" text-anchor="middle">(highest paid)</text>
<line x1="80" y1="213.1" x2="688" y2="213.1" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="694" y="210.1" font-size="13" font-weight="bold" fill="#1a1a1a">69.0% women</text>
<text x="694" y="226.1" font-size="12" fill="#444444">across all four</text>
<text x="30" y="486" font-size="12" fill="#555555">Full-pay relevant employees ranked by hourly pay, lowest to highest, and split into</text>
<text x="30" y="502" font-size="12" fill="#555555">four equal groups of 62. Hourly pay is ordinary pay for April 2026; overtime and bonuses are excluded.</text>
</svg>

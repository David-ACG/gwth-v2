<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" font-family="sans-serif" font-size="13"><text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold">Women and men in each pay quartile, 5 April 2026</text><rect x="70" y="60" width="95" height="58.7" fill="#2a6f97"/><rect x="70" y="118.7" width="95" height="201.3" fill="#c9506b"/><text x="117" y="94.4" text-anchor="middle" fill="#fff">Men 22.6%</text><text x="117" y="224.4" text-anchor="middle" fill="#fff">Women 77.4%</text><text x="117" y="340" text-anchor="middle">Lower</text><rect x="205" y="60" width="95" height="75.5" fill="#2a6f97"/><rect x="205" y="135.5" width="95" height="184.5" fill="#c9506b"/><text x="252" y="102.7" text-anchor="middle" fill="#fff">Men 29.0%</text><text x="252" y="232.7" text-anchor="middle" fill="#fff">Women 71.0%</text><text x="252" y="340" text-anchor="middle">Lower middle</text><rect x="340" y="60" width="95" height="67.1" fill="#2a6f97"/><rect x="340" y="127.1" width="95" height="192.9" fill="#c9506b"/><text x="387" y="98.5" text-anchor="middle" fill="#fff">Men 25.8%</text><text x="387" y="228.5" text-anchor="middle" fill="#fff">Women 74.2%</text><text x="387" y="340" text-anchor="middle">Upper middle</text><rect x="475" y="60" width="95" height="121.6" fill="#2a6f97"/><rect x="475" y="181.6" width="95" height="138.4" fill="#c9506b"/><text x="522" y="125.8" text-anchor="middle" fill="#fff">Men 46.8%</text><text x="522" y="255.8" text-anchor="middle" fill="#fff">Women 53.2%</text><text x="522" y="340" text-anchor="middle">Upper</text><text x="320" y="370" text-anchor="middle" fill="#555">Quartile 1 = lowest paid. 62 full-pay employees in each quartile.</text></svg>
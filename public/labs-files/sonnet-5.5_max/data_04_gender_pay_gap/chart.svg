<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="chart-title chart-desc" font-family="Arial, Helvetica, sans-serif">
<title id="chart-title">Women and men in each pay quartile, 5 April 2026</title>
<desc id="chart-desc">Stacked bars, one per pay quartile from lowest paid to highest paid. Women are 77.4% of the lower quartile, 71.0% of the lower middle quartile, 74.2% of the upper middle quartile, 53.2% of the upper quartile; men make up the rest of each quartile.</desc>
<rect width="900" height="630" fill="#FFFFFF"/>
<text x="40" y="46" font-size="26" font-weight="bold" fill="#1A1A1A">Women and men in each pay quartile</text>
<text x="40" y="74" font-size="15" fill="#4D4D4D">5 April 2026. The 248 full-pay employees ranked by hourly pay, split into four groups of 62.</text>
<rect x="40" y="87" width="16" height="16" fill="#0072B2"/>
<text x="62" y="100" font-size="15" fill="#1A1A1A">Women</text>
<rect x="150" y="87" width="16" height="16" fill="#E69F00"/>
<text x="172" y="100" font-size="15" fill="#1A1A1A">Men</text>
<text x="92" y="495.0" font-size="13" text-anchor="end" fill="#4D4D4D">0%</text>
<line x1="100" y1="400.0" x2="860" y2="400.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="92" y="405.0" font-size="13" text-anchor="end" fill="#4D4D4D">25%</text>
<line x1="100" y1="310.0" x2="860" y2="310.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="92" y="315.0" font-size="13" text-anchor="end" fill="#4D4D4D">50%</text>
<line x1="100" y1="220.0" x2="860" y2="220.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="92" y="225.0" font-size="13" text-anchor="end" fill="#4D4D4D">75%</text>
<line x1="100" y1="130.0" x2="860" y2="130.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="92" y="135.0" font-size="13" text-anchor="end" fill="#4D4D4D">100%</text>
<text x="30" y="310" font-size="14" text-anchor="middle" fill="#4D4D4D" transform="rotate(-90 30 310)">Share of people in each quartile</text>
<rect x="135.0" y="211.3" width="120" height="278.7" fill="#0072B2" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="135.0" y="130.0" width="120" height="81.3" fill="#E69F00" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="195.0" y="347.6" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">77.4%</text>
<text x="195.0" y="365.6" font-size="13" text-anchor="middle" fill="#FFFFFF">48 women</text>
<text x="195.0" y="167.6" font-size="20" font-weight="bold" text-anchor="middle" fill="#1A1A1A">22.6%</text>
<text x="195.0" y="185.6" font-size="13" text-anchor="middle" fill="#1A1A1A">14 men</text>
<text x="195.0" y="518" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Lower</text>
<text x="195.0" y="537" font-size="13" text-anchor="middle" fill="#4D4D4D">quartile 1, lowest paid</text>
<rect x="325.0" y="234.5" width="120" height="255.5" fill="#0072B2" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="325.0" y="130.0" width="120" height="104.5" fill="#E69F00" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="385.0" y="359.3" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">71.0%</text>
<text x="385.0" y="377.3" font-size="13" text-anchor="middle" fill="#FFFFFF">44 women</text>

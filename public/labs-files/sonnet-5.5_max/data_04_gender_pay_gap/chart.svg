<text x="385.0" y="518" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Lower middle</text>
<text x="385.0" y="537" font-size="13" text-anchor="middle" fill="#4D4D4D">quartile 2</text>
<rect x="515.0" y="222.9" width="120" height="267.1" fill="#0072B2" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="515.0" y="130.0" width="120" height="92.9" fill="#E69F00" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="575.0" y="353.5" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">74.2%</text>

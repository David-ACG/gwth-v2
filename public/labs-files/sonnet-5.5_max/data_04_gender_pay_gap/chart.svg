<text x="575.0" y="518" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Upper middle</text>
<text x="575.0" y="537" font-size="13" text-anchor="middle" fill="#4D4D4D">quartile 3</text>
<rect x="705.0" y="298.4" width="120" height="191.6" fill="#0072B2" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="705.0" y="130.0" width="120" height="168.4" fill="#E69F00" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="765.0" y="391.2" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">53.2%</text>
<text x="765.0" y="409.2" font-size="13" text-anchor="middle" fill="#FFFFFF">33 women</text>
<text x="765.0" y="211.2" font-size="20" font-weight="bold" text-anchor="middle" fill="#1A1A1A">46.8%</text>
<text x="765.0" y="229.2" font-size="13" text-anchor="middle" fill="#1A1A1A">29 men</text>
<text x="765.0" y="518" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Upper</text>
<text x="765.0" y="537" font-size="13" text-anchor="middle" fill="#4D4D4D">quartile 4, highest paid</text>
<line x1="100" y1="490" x2="860" y2="490" stroke="#4D4D4D" stroke-width="1.5"/>
<text x="40" y="578" font-size="13" fill="#4D4D4D">Women are 69.0% of the 248 people in these figures, so an even spread would show about 69% women in every quartile.</text>
<text x="40" y="598" font-size="13" fill="#4D4D4D">Based on hourly pay in the April 2026 pay run. People on maternity, sick or unpaid leave at reduced pay are not included.</text>
</svg>

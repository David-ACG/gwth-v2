<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GWTH Score — Variant B: Freshness Ring + Sparkline</title>
<style>
  :root {
    --bg: oklch(0.98 0 0);
    --fg: oklch(0.18 0.04 175);
    --card: oklch(1 0 0);
    --muted: oklch(0.95 0.01 220);
    --muted-fg: oklch(0.5 0.02 220);
    --primary: oklch(0.7 0.18 220);
    --accent: oklch(0.65 0.16 165);
    --warning: oklch(0.75 0.15 75);
    --danger: oklch(0.65 0.21 27);
    --success: oklch(0.6 0.18 145);
    --border: oklch(0.9 0.02 220);
  }
  body.dark {
    --bg: oklch(0.17 0.005 60);
    --fg: oklch(0.93 0.008 60);
    --card: oklch(0.21 0.005 60);
    --muted: oklch(0.24 0.006 60);
    --muted-fg: oklch(0.65 0.015 60);
    --primary: oklch(0.75 0.16 220);
    --accent: oklch(0.75 0.14 165);
    --border: oklch(1 0 0 / 12%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; height: 100%; }
  body { display: grid; place-items: center; padding: 24px; }
  .stage { width: 100%; max-width: 720px; }

  .device { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 48px oklch(0 0 0 / 0.08); overflow: hidden; }
  .device-chrome { background: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #ffbd2e; } .dot.g { background: #28ca42; }
  .device-url { margin-left: 12px; font-size: 12px; color: var(--muted-fg); background: var(--bg); padding: 4px 12px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; }

  .body-pad { padding: 28px 32px 36px; }
  .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: grid; place-items: center; color: white; font-weight: 600; font-size: 18px; }
  .profile-name { font-weight: 600; font-size: 16px; }
  .profile-role { color: var(--muted-fg); font-size: 13px; margin-top: 2px; }

  /* === RING WIDGET === */
  .ring-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; position: relative; }
  .ring-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ring-title { font-size: 13px; font-weight: 600; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.05em; }
  .example-pill { font-size: 10px; padding: 3px 8px; border-radius: 999px; background: var(--muted); color: var(--muted-fg); font-weight: 600; letter-spacing: 0.05em; }

  .ring-stack { display: grid; place-items: center; padding: 8px 0 12px; }
  .ring-svg { width: 200px; height: 200px; transform: rotate(-90deg); }
  .ring-bg { stroke: var(--muted); stroke-width: 14; fill: none; }
  .ring-progress { stroke: var(--primary); stroke-width: 14; fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
  .ring-halo { stroke: var(--accent); stroke-width: 14; fill: none; stroke-linecap: round; opacity: 0.85; filter: drop-shadow(0 0 8px var(--accent)); transition: stroke-dashoffset 1s ease; }
  .ring-center { position: absolute; display: grid; place-items: center; }
  .ring-num { font-size: 56px; font-weight: 700; line-height: 1; font-feature-settings: 'tnum'; letter-spacing: -0.02em; }
  .ring-status { color: var(--muted-fg); font-size: 12px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .ring-status.pass { color: var(--success); }
  .ring-status.decay { color: var(--warning); }

  .ring-grid-pos { display: grid; grid-template: 1fr / 1fr; place-items: center; height: 200px; position: relative; }
  .ring-grid-pos > * { grid-area: 1 / 1; }

  /* === SPARKLINE === */
  .spark { margin-top: 16px; padding: 0 4px; }
  .spark svg { width: 100%; height: 60px; }
  .spark-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-fg); margin-top: 4px; font-feature-settings: 'tnum'; }
  .pass-line-label { position: absolute; right: 4px; font-size: 10px; color: var(--muted-fg); }

  .caveat { margin-top: 14px; font-size: 11px; color: var(--muted-fg); font-style: italic; line-height: 1.4; }

  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .toggle { font-size: 12px; padding: 6px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--fg); }
  .scenarios { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .scenario { font-size: 11px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; background: transparent; color: var(--fg); }
  .scenario.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }

  @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: var(--final); } }
</style>
</head>
<body>
<div class="stage">
  <div class="toolbar"><button class="toggle" onclick="document.body.classList.toggle('dark')">Toggle theme</button></div>

  <div class="scenarios">
    <button class="scenario" data-score="92"  data-history="100,98,102,105,108,103,99,95,93,92">Below pass (decaying)</button>
    <button class="scenario active" data-score="104" data-history="118,115,112,110,108,106,105,104,103,104">Passing, slipping</button>
    <button class="scenario" data-score="120" data-history="80,85,90,95,100,108,114,118,120,120">Bonus zone</button>
    <button class="scenario" data-score="100" data-history="80,85,88,92,95,97,99,99,100,100">Just hit pass</button>
  </div>

  <div class="device">
    <div class="device-chrome">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <div class="device-url">gwth.ai/dashboard</div>
    </div>
    <div class="body-pad">
      <div class="profile-row">
        <div class="avatar">AE</div>
        <div>
          <div class="profile-name">Alex Example</div>
          <div class="profile-role">Engineering Manager · Manchester</div>
        </div>
      </div>

      <div class="ring-card">
        <div class="ring-header">
          <div class="ring-title">GWTH Score</div>
          <div class="example-pill">EXAMPLE</div>
        </div>

        <div class="ring-grid-pos">
          <svg viewBox="0 0 200 200" class="ring-svg pulse" id="ring-pulse">
            <circle cx="100" cy="100" r="86" class="ring-bg" />
            <circle cx="100" cy="100" r="86" class="ring-progress" id="ring-progress"
              stroke-dasharray="540.354" stroke-dashoffset="0" />
            <circle cx="100" cy="100" r="86" class="ring-halo" id="ring-halo"
              stroke-dasharray="540.354" stroke-dashoffset="453" />
          </svg>
          <div class="ring-center">
            <div class="ring-num" id="ring-num">104</div>
            <div class="ring-status pass" id="ring-pill">Passing</div>
          </div>
        </div>

        <div class="spark">
          <svg viewBox="0 0 300 60" preserveAspectRatio="none">
            <!-- Pass line -->
            <line x1="0" x2="300" y1="20" y2="20" stroke="var(--muted-fg)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />
            <text x="296" y="16" text-anchor="end" font-size="9" fill="var(--muted-fg)">100</text>
            <!-- Sparkline -->
            <polyline id="spark-main" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="" />
            <line id="spark-decay" stroke="var(--warning)" stroke-width="3" stroke-linecap="round" x1="0" y1="0" x2="0" y2="0" style="display:none" />
            <circle id="spark-dot" cx="280" cy="20" r="4" fill="var(--primary)">
              <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </div>
        <div class="spark-axis">
          <span>30 days ago</span><span>today</span>
        </div>

        <div class="caveat">Illustrative — your actual GWTH Score reflects verified work.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const C = 2 * Math.PI * 86;  // circumference
  const ringProg = document.getElementById('ring-progress');
  const ringHalo = document.getElementById('ring-halo');
  const ringNum = document.getElementById('ring-num');
  const ringPill = document.getElementById('ring-pill');
  const sparkMain = document.getElementById('spark-main');
  const sparkDecay = document.getElementById('spark-decay');
  const sparkDot = document.getElementById('spark-dot');
  const scenarios = document.querySelectorAll('.scenario');

  ringProg.setAttribute('stroke-dasharray', C);
  ringHalo.setAttribute('stroke-dasharray', C);

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function apply(score, history) {
    const passLine = 100;
    // Primary fill 0..100
    const primaryFraction = clamp(score / passLine, 0, 1);
    ringProg.style.strokeDashoffset = C * (1 - primaryFraction);

    // Halo for >100 (bonus zone 100..130)
    if (score > passLine) {
      const haloFraction = clamp((score - passLine) / 30, 0, 1);
      ringHalo.style.strokeDashoffset = C * (1 - haloFraction);
      ringHalo.style.display = '';
    } else {
      ringHalo.style.display = 'none';
    }

    ringNum.textContent = score;

    // Status logic
    const N = history.length;
    const crossesDown = N >= 2 && history[N-2] >= passLine && history[N-1] < passLine;
    if (score >= passLine) {
      ringPill.textContent = 'Passing';
      ringPill.className = 'ring-status pass';
    } else if (crossesDown) {
      ringPill.textContent = 'Decaying';
      ringPill.className = 'ring-status decay';
    } else {
      ringPill.textContent = 'Building';
      ringPill.className = 'ring-status';
    }

    // Sparkline — map history (min 50, max 130) to y (60 down to 0). Pass line at 100 → y=20.
    // y = 60 - ((v - 50) / 80) * 60
    const yFor = v => 60 - ((v - 50) / 80) * 60;
    const xFor = (i, len) => (i / (len - 1)) * 300;
    const pts = history.map((v, i) => `${xFor(i, history.length).toFixed(1)},${yFor(v).toFixed(1)}`);
    sparkMain.setAttribute('points', pts.join(' '));

    // Decay segment — last segment if it crosses pass-line downward
    const lastCross = history[history.length - 2] >= passLine && history[history.length - 1] < passLine;
    if (lastCross) {
      const x1 = xFor(history.length - 2, history.length);
      const y1 = yFor(history[history.length - 2]);
      const x2 = xFor(history.length - 1, history.length);
      const y2 = yFor(history[history.length - 1]);
      sparkDecay.setAttribute('x1', x1); sparkDecay.setAttribute('y1', y1);
      sparkDecay.setAttribute('x2', x2); sparkDecay.setAttribute('y2', y2);
      sparkDecay.style.display = '';
    } else {
      sparkDecay.style.display = 'none';
    }

    sparkDot.setAttribute('cx', xFor(history.length - 1, history.length));
    sparkDot.setAttribute('cy', yFor(history[history.length - 1]));
    sparkDot.setAttribute('fill', score < passLine && lastCross ? 'var(--warning)' : 'var(--primary)');
  }

  scenarios.forEach(btn => btn.addEventListener('click', () => {
    scenarios.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    apply(+btn.dataset.score, btn.dataset.history.split(',').map(Number));
  }));

  // Initial render — match active scenario
  apply(104, [118,115,112,110,108,106,105,104,103,104]);
</script>
</body>
</html>
